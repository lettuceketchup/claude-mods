<style>
/* Layout: one phone-width column, sticky section chips, cards only for legs and maps. System fonts: nothing to download. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2230; --muted: #5d6779; --line: #dfe3ea;
  --accent: #1f4fa3; --accent-soft: #e6eefb;
  --good: #1d7a46; --good-bg: #e3f4ea; --warn: #9a5b00; --warn-bg: #fdf0d9; --bad: #b3261e; --bad-bg: #fbe4e2;
  --k-station: #1f4fa3; --k-stay: #7a3fb0; --k-sight: #c2410c; --k-help: #b3261e; --k-stop: #4b5563;
  --r1: #2563c9; --r2: #d9480f; --r3: #1f8a5c; --r4: #9b3fbf;
  --map-sea: #dbe7f2; --map-land: #fbfaf6; --map-border: #b9bfb0; --map-city: #6b7064; --map-line: #1b2230;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --surface: #1a202a; --fg: #e8ebf1; --muted: #9aa4b5; --line: #2c3442;
  --accent: #8db4ff; --accent-soft: #1d2b45;
  --good: #6fd29a; --good-bg: #16301f; --warn: #f2bd62; --warn-bg: #362811; --bad: #ff8f86; --bad-bg: #3a1a18;
  --k-station: #3b6fd0; --k-stay: #8b52c4; --k-sight: #d0561c; --k-help: #c93a32; --k-stop: #5d6779;
  --r1: #6ea0ff; --r2: #ff8a4c; --r3: #4fcf95; --r4: #d08cf0;
  --map-sea: #0d1a26; --map-land: #232a35; --map-border: #48505e; --map-city: #a7afbd; --map-line: #e8ebf1;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #1a202a; --fg: #e8ebf1; --muted: #9aa4b5; --line: #2c3442;
  --accent: #8db4ff; --accent-soft: #1d2b45;
  --good: #6fd29a; --good-bg: #16301f; --warn: #f2bd62; --warn-bg: #362811; --bad: #ff8f86; --bad-bg: #3a1a18;
  --k-station: #3b6fd0; --k-stay: #8b52c4; --k-sight: #d0561c; --k-help: #c93a32; --k-stop: #5d6779;
  --r1: #6ea0ff; --r2: #ff8a4c; --r3: #4fcf95; --r4: #d08cf0;
  --map-sea: #0d1a26; --map-land: #232a35; --map-border: #48505e; --map-city: #a7afbd; --map-line: #e8ebf1;
  color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
main, header .in, nav .in { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header .in { padding-block: 20px 12px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.1rem; margin: 0 0 10px; }
h3 { font-size: 1rem; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.verdict { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 500; }
.verdict.go { background: var(--good-bg); color: var(--good); }
.verdict.care { background: var(--warn-bg); color: var(--warn); }
.verdict.nogo { background: var(--bad-bg); color: var(--bad); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 16px; margin: 14px 0 0; }
.facts dt { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav .in { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
nav a { flex: none; text-decoration: none; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); font-size: .85rem; }
section { padding-block: 22px 4px; scroll-margin-top: 56px; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.row { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.row > :first-child { min-width: 0; }
.pill { flex: none; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--line); color: var(--fg); white-space: nowrap; }
.pill.pass, .pill.confirmed { background: var(--good-bg); color: var(--good); }
.pill.risky, .pill.waitlisted, .pill.opennow { background: var(--warn-bg); color: var(--warn); }
.pill.fail { background: var(--bad-bg); color: var(--bad); }
.note { color: var(--muted); font-size: .9rem; }
.links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .9rem; }
.day { border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 16px; }
.day .lbl { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.item { display: grid; grid-template-columns: 3.4rem 1fr; gap: 8px; margin-top: 8px; }
.item time { font-variant-numeric: tabular-nums; color: var(--muted); }
.item > div { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.opt { padding-block: 10px; border-top: 1px solid var(--line); }
.opt:first-of-type { border-top: 0; }
.opt .meta { font-variant-numeric: tabular-nums; }
.rec { font-size: .72rem; font-weight: 700; color: var(--good); letter-spacing: .04em; text-transform: uppercase; }
/* Map: Leaflet with the built-in India basemap, no tiles. Numbered pins; labels hide when they would collide. */
.lmap { height: 380px; border-radius: 10px; margin: 8px 0; background: var(--map-sea); font: inherit; }
.lmap .leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--muted); }
.lmap .leaflet-control-attribution a { color: var(--muted); }
.lmap .leaflet-control-scale-line { background: color-mix(in srgb, var(--surface) 85%, transparent); border-color: var(--fg); color: var(--fg); }
.lmap .leaflet-bar a { background: var(--surface); color: var(--fg); border-bottom-color: var(--line); }
.lmap .leaflet-popup-content-wrapper, .lmap .leaflet-popup-tip { background: var(--surface); color: var(--fg); }
.lmap .leaflet-popup-content { margin: 10px 14px; font: 14px/1.45 var(--font); }
.pin { position: absolute; left: 0; top: 0; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--surface);
  color: #fff; font: 700 13px/22px var(--font); text-align: center; box-shadow: 0 1px 3px rgb(0 0 0 / .35); }
.pw { position: absolute; left: -13px; top: -13px; }
.anchor, .leader { position: absolute; display: none; pointer-events: none; }
.anchor { left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--surface); box-sizing: border-box; }
.leader { left: 0; top: -1px; height: 2px; transform-origin: 0 50%; opacity: .8; }
.moved .anchor, .moved .leader { display: block; }
.plabel, .clabel, .llabel { position: absolute; white-space: nowrap; pointer-events: none; }
.plabel { top: 3px; left: 31px; font: 700 13px/20px var(--font); color: var(--fg); padding: 0 5px; border-radius: 5px; background: color-mix(in srgb, var(--surface) 88%, transparent); }
.plabel.left { left: auto; right: 31px; }
.clabel { top: -7px; left: 7px; font: 12px/14px var(--font); color: var(--map-city); text-shadow: 0 0 3px var(--map-land), 0 0 3px var(--map-land); }
.cdot { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--map-city); }
.llabel { transform: translate(-50%, -50%); font: 600 11px/16px var(--font); color: var(--fg); padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.k-station { background: var(--k-station); } .k-stay { background: var(--k-stay); } .k-sight { background: var(--k-sight); } .k-help { background: var(--k-help); } .k-stop { background: var(--k-stop); }
.num { display: inline-block; min-width: 22px; height: 22px; border-radius: 50%; color: #fff; font: 700 12px/22px var(--font); text-align: center; margin-right: 8px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); margin: 6px 0; align-items: center; }
.legend svg { vertical-align: middle; margin-right: 4px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.btn.fitbtn { font: 600 12px var(--font); padding: 6px 10px; border-radius: 8px; }
.chips { display: grid; gap: 6px; margin: 10px 0 4px; }
.chip { display: flex; gap: 10px; align-items: flex-start; text-align: left; font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.chip.on { border-color: var(--fg); background: var(--surface); }
.chip .note { display: block; }
.swatch { flex: none; width: 18px; height: 6px; border-radius: 3px; margin-top: 8px; }
.legs { margin-top: 6px; }
.pl { display: flex; align-items: baseline; }
.arrow { margin: 0 6px 0 -2px; color: var(--muted); }
.map h4 { margin: 14px 0 6px; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-block; font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 10px; border: 0; background: var(--accent); color: var(--surface); text-decoration: none; cursor: pointer; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th:not(:first-child), td:not(:first-child) { text-align: right; }
tfoot td { font-weight: 700; }
textarea { width: 100%; box-sizing: border-box; min-height: 12rem; font: .9rem/1.45 var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
footer { color: var(--muted); font-size: .8rem; padding-block: 24px; }

<script>
(function () {

  if (D.checks?.length) section('checks', 'Checks', $('ul', { class: 'list' }, D.checks.map(c =>
    $('li', {}, $('div', { class: 'row' }, $('strong', {}, c.name), pill(c.status)), c.note && $('div', { class: 'note' }, c.note), linkRow([{ label: 'Source', url: c.url }])))));

    const when = d => { const t = new Date(d + 'T00:00'); const n = Math.round((t - today) / 864e5);
      return isNaN(n) ? '' : n === 0 ? 'today' : n > 0 ? `in ${n} day${n > 1 ? 's' : ''}` : 'opened'; };

  if (D.legs?.length) section('travel', 'Travel', D.legs.map(l => $('div', { class: 'card' },
    $('h3', {}, `${l.from} → ${l.to}`),
    (l.options || []).map(o => {
      const extra = o.train ? [{ label: 'Running status', url: 'https://www.railyatri.in/live-train-status/' + o.train }, { label: 'Schedule', url: 'https://erail.in/train-enquiry/' + o.train }] : [];

        $('div', { class: 'row' }, $('strong', {}, o.name || o.mode), $('span', { class: 'note' }, o.mode)),
        $('div', { class: 'meta' }, [o.dep && `Dep ${o.dep}`, o.arr && `Arr ${o.arr}`, o.duration, o.cost].filter(Boolean).join(' · ')),
        o.note && $('div', { class: 'note' }, o.note), linkRow([...extra, ...(o.links || [])]));
    }))));

  // Maps: Leaflet + the built-in India basemap (window.BASEMAP). No tiles: the artifact sandbox blocks external images.
  // Colour = route option, line style = travel mode. Only the selected option shows leg labels.
  const KINDS = { station: 'Station', stay: 'Stay', sight: 'Sight', help: 'Help', stop: 'Stop' };
  const MODES = { train: ['Train', null, 4], road: ['Road', '9 7', 3.5], bus: ['Road', '9 7', 3.5], trek: ['Trek / walk', '1 8', 4.5], walk: ['Trek / walk', '1 8', 4.5], flight: ['Flight', '14 8', 3], boat: ['Boat', '10 4 2 4', 3.5] };
  const mode = by => MODES[by] || MODES.road;
  const kindOf = p => KINDS[p.kind] ? p.kind : 'stop';
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const overlap = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  const legText = l => [l.name || mode(l.by)[0], l.time, l.km && `${Number(l.km).toLocaleString('en-IN')} km`].filter(Boolean).join(' · ');
  const arc = (a, b) => { // flights bow sideways so they never sit on top of a train or road line
    const c = [(a[0] + b[0]) / 2 - (b[1] - a[1]) * 0.18, (a[1] + b[1]) / 2 + (b[0] - a[0]) * 0.18];
    return Array.from({ length: 25 }, (_, i) => { const t = i / 24, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; });
  };
  const dirUrl = names => 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(names[0]) + '&destination=' + encodeURIComponent(names[names.length - 1]) +
    (names.length > 2 ? '&waypoints=' + encodeURIComponent(names.slice(1, -1).slice(0, 8).join('|')) : '');
  const initMaps = [];
  const drawMap = m => {
    const pts = (m.points || []).filter(p => isFinite(p.lat) && isFinite(p.lon));
    const byName = {}; pts.forEach((p, i) => { byName[p.name] = Object.assign({ n: i + 1 }, p); });
    const routes = (m.routes || []).map((r, i) => ({ ...r, color: `var(--r${i % 4 + 1})`, legs: (r.legs || []).filter(l => byName[l.from] && byName[l.to]) })).filter(r => r.legs.length);
    let sel = Math.max(0, routes.findIndex(r => r.recommended));
    const card = $('div', { class: 'card map' }, $('h3', {}, m.title));
    const box = $('div', { class: 'lmap', role: 'region', 'aria-label': m.title + ' map' });
    // Option chips (only when there is more than one route to compare)
    const chips = routes.map((r, i) => {
      const b = $('button', { type: 'button', class: 'chip' }, $('span', { class: 'swatch', style: `background:${r.color}` }),
        $('span', {}, $('strong', {}, r.name || `Option ${i + 1}`), r.recommended && $('span', { class: 'rec' }, ' · Recommended'), r.note && $('span', { class: 'note' }, r.note)));
      b.addEventListener('click', () => { sel = i; select(); });
      return b;
    });
    if (chips.length > 1) card.append($('div', { class: 'chips' }, chips));
    if (pts.length) card.append(box);
    const allModes = [...new Set(routes.flatMap(r => r.legs.map(l => mode(l.by)[0])))];
    const modeSvg = name => { const md = Object.values(MODES).find(x => x[0] === name);
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', 30); s.setAttribute('height', 10);
      s.innerHTML = `<line x1="2" y1="5" x2="28" y2="5" stroke="var(--fg)" stroke-width="${md[2]}" stroke-linecap="round" ${md[1] ? `stroke-dasharray="${md[1]}"` : ''}/>`; return s; };
    if (pts.length) card.append($('div', { class: 'legend' }, [...new Set(pts.map(kindOf))].map(k => $('span', {}, $('span', { class: 'dot k-' + k }), KINDS[k])), allModes.map(n => $('span', {}, modeSvg(n), n))));
    // Selected route's legs, in words
    const legList = $('ul', { class: 'list' }), gmBtn = $('a', { class: 'btn', target: '_blank', rel: 'noopener' }, 'Open this route in Google Maps');
    if (routes.length) card.append($('div', { class: 'legs' }, legList, $('p', {}, gmBtn)));
    card.append($('h4', {}, 'Places'), $('ul', { class: 'list' }, pts.map((p, i) => $('li', {}, $('div', { class: 'row' },
      $('span', { class: 'pl' }, $('span', { class: 'num k-' + kindOf(p) }, i + 1), $('span', {}, $('strong', {}, p.name), p.note && $('span', { class: 'note' }, ' · ' + p.note))),
      $('a', { href: gm(p.q || p.name), target: '_blank', rel: 'noopener' }, 'Map'))))));
    let onSelect = () => {};
    const select = () => {
      chips.forEach((c, i) => c.classList.toggle('on', i === sel));
      const r = routes[sel]; if (!r) return;
      legList.replaceChildren(...r.legs.map(l => { const a = byName[l.from], b = byName[l.to];
        return $('li', {}, $('div', { class: 'pl' }, $('span', { class: 'num k-' + kindOf(a) }, a.n), $('span', { class: 'arrow' }, '→'), $('span', { class: 'num k-' + kindOf(b) }, b.n),
          $('span', {}, $('strong', {}, legText(l)), $('div', { class: 'note' }, `${l.from} to ${l.to}${l.note ? ' · ' + l.note : ''}`)))); }));
      const stops = [r.legs[0].from, ...r.legs.map(l => l.to)].map(n => byName[n].q || n);
      gmBtn.href = dirUrl(stops);
      onSelect();
    };
    if (pts.length) initMaps.push(() => {
      if (!window.L) { box.replaceWith($('p', { class: 'note' }, 'The map could not load. Every place is listed below with a Google Maps link.')); select(); return; }
      const map = L.map(box, { zoomSnap: 0.25, scrollWheelZoom: false, minZoom: 4, maxZoom: 15, maxBounds: [[0, 60], [42, 104]], maxBoundsViscosity: 0.8 });
      // Touchpad pinch and Ctrl+scroll zoom the map; plain scrolling still scrolls the page.
      let pinch = 0; // pinch events are tiny; add them up until they make a full 0.25 zoom step
      box.addEventListener('wheel', e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault();
        pinch -= e.deltaY * (e.deltaMode ? 0.33 : 0.012);
        const step = Math.trunc(pinch / 0.25) * 0.25; if (!step) return; pinch -= step;
        map.setZoomAround(map.mouseEventToContainerPoint(e), map.getZoom() + step, { animate: false }); }, { passive: false });
      map.attributionControl.setPrefix(false).addAttribution('Borders: <a href="https://github.com/datameet/maps" target="_blank" rel="noopener">DataMeet</a> (CC BY 4.0) · Places: Natural Earth');
      L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
      const fit = () => pts.length > 1 ? map.fitBounds(pts.map(p => [p.lat, p.lon]), { padding: [40, 40], maxZoom: 14 }) : map.setView([pts[0].lat, pts[0].lon], 13);
      fit(); // the view must exist before markers are added
      let lastW = box.clientWidth; // a map first drawn hidden (zero size) fits itself again once it can be seen
      if (window.ResizeObserver) new ResizeObserver(() => { const w = box.clientWidth; map.invalidateSize(); if (!lastW && w) fit(); lastW = w; }).observe(box);
      const B = window.BASEMAP || { states: [], cities: [] };
      const ring = r => { const a = []; for (let i = 0; i < r.length; i += 2) a.push([r[i], r[i + 1]]); return a; };
      B.states.forEach(([, rings]) => L.polygon(rings.map(ring), { color: 'var(--map-border)', weight: 1, fillColor: 'var(--map-land)', fillOpacity: 1, interactive: false }).addTo(map));
      const cityLayer = L.layerGroup().addTo(map);
      const cities = B.cities.filter(([, lat, lon]) => !pts.some(p => Math.abs(p.lat - lat) < 0.03 && Math.abs(p.lon - lon) < 0.03)) // a trip pin already marks it
        .map(([name, lat, lon, rank]) => [L.marker([lat, lon], { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<span class="cdot"></span><span class="clabel">${esc(name)}</span>` }) }), rank]);
      // Routes: a light casing under each line keeps it readable over borders and other routes
      routes.forEach(r => {
        r.lines = []; r.labelLayer = L.layerGroup();
        r.legs.forEach(l => {
          const a = [byName[l.from].lat, byName[l.from].lon], b = [byName[l.to].lat, byName[l.to].lon], md = mode(l.by);
          const path = l.by === 'flight' ? arc(a, b) : [a, b], mid = path.length > 2 ? path[12] : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          r.lines.push(L.polyline(path, { color: 'var(--surface)', weight: md[2] + 4, opacity: 0.9, interactive: false }).addTo(map),
            L.polyline(path, { color: r.color, weight: md[2], dashArray: md[1], lineCap: 'round', interactive: false }).addTo(map));
          r.labelLayer.addLayer(L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [0, 0],
            html: `<span class="llabel" style="border-color:${r.color}">${esc(legText(l))}</span>` }) }));
        });
      });
      const pins = pts.map((p, i) => {
        const mk = L.marker([p.lat, p.lon], { title: p.name, riseOnHover: true, icon: L.divIcon({ className: '', iconSize: [0, 0], popupAnchor: [0, -14],
          html: `<span class="leader k-${kindOf(p)}"></span><span class="anchor k-${kindOf(p)}"></span><div class="pw"><span class="pin k-${kindOf(p)}">${i + 1}</span><span class="plabel">${esc(p.name)}</span></div>` }) }).addTo(map);
        mk.bindPopup($('div', {}, $('strong', {}, `${i + 1}. ${p.name}`), $('div', { class: 'note' }, KINDS[kindOf(p)] + (p.note ? ' · ' + p.note : '')),
          $('p', { style: 'margin:8px 0 0' }, $('a', { class: 'btn fitbtn', href: gm(p.q || p.name), target: '_blank', rel: 'noopener' }, 'Open in Google Maps'))));
        return mk.getElement();
      });
      // Pins that land on top of each other get nudged apart, with a leader line back to their true spot.
      const NUDGE = [[0, -32], [32, -16], [32, 16], [0, 32], [-32, 16], [-32, -16], [0, -60], [56, 0], [0, 60], [-56, 0]];
      const declutter = () => { // every pin stays visible; a label that would cover a pin, a more important label or the map edge hides
        const cb = box.getBoundingClientRect(), out = r => r.left < cb.left || r.right > cb.right || r.top < cb.top || r.bottom > cb.bottom;
        const taken = [];
        pins.forEach(el => {
          const pw = el.querySelector('.pw'), pin = el.querySelector('.pin'), ld = el.querySelector('.leader');
          pw.style.transform = ''; el.classList.remove('moved');
          let r = pin.getBoundingClientRect();
          if (taken.some(t => overlap(r, t))) for (const [dx, dy] of NUDGE) {
            pw.style.transform = `translate(${dx}px,${dy}px)`; r = pin.getBoundingClientRect();
            if (!taken.some(t => overlap(r, t)) && !out(r)) { ld.style.width = Math.hypot(dx, dy) + 'px'; ld.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`; el.classList.add('moved'); break; }
          }

        cityLayer.clearLayers();

        const labels = [...pins.map(el => [el.querySelector('.plabel'), true]), ...[...box.querySelectorAll('.llabel')].map(l => [l]),
          ...cityLayer.getLayers().map(mk => [mk.getElement().querySelector('.clabel'), false, mk.getElement()])];
        labels.forEach(([l, , host]) => { l.style.visibility = ''; l.classList.remove('left'); if (host) host.style.visibility = ''; });
        for (const [l, flip, host] of labels) {
          let r = l.getBoundingClientRect();
          if (flip && (out(r) || taken.some(t => overlap(r, t)))) { l.classList.add('left'); r = l.getBoundingClientRect(); }
          if (out(r) || taken.some(t => overlap(r, t))) { l.style.visibility = 'hidden'; if (host) host.style.visibility = 'hidden'; continue; }
          taken.push(r);
        }

        routes.forEach((r, i) => { const on = i === sel;
          r.lines.forEach((pl, j) => { pl.setStyle({ opacity: on ? (j % 2 ? 1 : 0.9) : (j % 2 ? 0.3 : 0) }); if (on) pl.bringToFront(); });

        L.DomEvent.disableClickPropagation(b); b.addEventListener('click', fit); return b; } });

      $('tbody', {}, b.rows.map(r => $('tr', {}, $('td', {}, r.item), $('td', {}, inr(+r.pp || 0)), $('td', {}, inr(+r.total || 0))))),

    $('li', {}, $('label', { class: 'check' }, $('input', { type: 'checkbox', id: 'c' + i }), $('span', {}, c))))));

    const ta = $('textarea', { id: 'wa', readonly: '' }); ta.value = D.whatsapp;
    const btn = $('button', { class: 'btn', type: 'button' }, 'Copy message');
    btn.addEventListener('click', () => {

  if (D.sources?.length) section('sources', 'Sources', $('ul', { class: 'list note' }, D.sources.map(s =>
    $('li', {}, link(s.label || s.url, s.url) || s.label, s.checked && ` · checked ${s.checked}`))));
